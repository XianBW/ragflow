version: '3.8'

services:
  # 主RAGFlow服务
  ragflow-main:
    build: ..
    ports:
      - "9380:9380"
      - "9381:9381"
    environment:
      - API_SERVER_URL=http://localhost:9380/
    volumes:
      - ragflow_data:/ragflow/data
      - ragflow_logs:/ragflow/logs
    restart: unless-stopped

  # 独立的API服务器实例
  ragflow-api-server:
    build: ..
    ports:
      - "9382:9380"
    environment:
      - API_SERVER_URL=http://ragflow-api-server:9380/
    command: ["./entrypoint.sh", "--disable-webserver"]
    volumes:
      - ragflow_data:/ragflow/data
      - ragflow_logs:/ragflow/logs
    restart: unless-stopped

  # 前端服务，连接到独立的API服务器
  ragflow-frontend:
    build: ..
    ports:
      - "9383:9380"
      - "9384:9381"
    environment:
      - API_SERVER_URL=http://ragflow-api-server:9380/
    volumes:
      - ragflow_data:/ragflow/data
      - ragflow_logs:/ragflow/logs
    restart: unless-stopped
    depends_on:
      - ragflow-api-server

  # 多实例部署示例
  ragflow-instance-1:
    build: ..
    ports:
      - "9390:9380"
      - "9391:9381"
    environment:
      - API_SERVER_URL=http://ragflow-instance-1:9380/
    volumes:
      - ragflow_data_1:/ragflow/data
      - ragflow_logs_1:/ragflow/logs
    restart: unless-stopped

  ragflow-instance-2:
    build: ..
    ports:
      - "9392:9380"
      - "9393:9381"
    environment:
      - API_SERVER_URL=http://ragflow-instance-2:9380/
    volumes:
      - ragflow_data_2:/ragflow/data
      - ragflow_logs_2:/ragflow/logs
    restart: unless-stopped

volumes:
  ragflow_data:
  ragflow_logs:
  ragflow_data_1:
  ragflow_logs_1:
  ragflow_data_2:
  ragflow_logs_2: 