services:
  # pikerag前端服务 - 使用优化的Dockerfile
  pikerag-frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend.optimized
    container_name: pikerag-frontend
    ports:
      - "8080:80"
    environment:
      - API_SERVER_URL=http://117.72.125.202:9380/
    volumes:
      # 外挂nginx配置文件
      - ./nginx/frontend-external.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - pikerag-network
    # 覆盖默认的启动命令，直接使用nginx
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]

networks:
  pikerag-network:
    driver: bridge 