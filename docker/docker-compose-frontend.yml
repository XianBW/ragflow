services:
  # pikerag前端服务 - 支持外挂nginx配置
  pikerag-fd:
    image: pikerag-frontend:latest
    container_name: pikerag-fd
    ports:
      - "8081:80"
    environment:
      - API_SERVER_URL=${API_SERVER_URL:-http://117.72.125.202:9380/}
    volumes:
      # 挂载nginx配置模板
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ragflow.conf.template:/etc/nginx/conf.d/ragflow.conf.template
      # 挂载启动脚本
      - ./nginx/start.sh:/start.sh
    restart: unless-stopped
    networks:
      - pikerag-network
    # 使用启动脚本
    entrypoint: ["/bin/sh"]
    command: ["/start.sh"]

networks:
  pikerag-network:
    driver: bridge 